<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SchoolAudit — Northern Cape DoE</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #F3F6FB; color: #111827; font-size: 14px; line-height: 1.5;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #F3F4F6; }
    ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: #94A3B8; }
    #root { display: flex; min-height: 100vh; }
    aside {
      width: 220px; flex-shrink: 0;
      background: linear-gradient(180deg, #1e3a5f, #1e40af);
      padding: 1.5rem 0; overflow-y: auto;
    }
    main { flex: 1; padding: 2rem; max-width: 980px; overflow-y: auto; }
    h2 { font-size: 18px; font-weight: 500; color: #111827; }
    h3 { font-size: 15px; font-weight: 500; color: #111827; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    thead tr { border-bottom: 0.5px solid #E5E7EB; }
    th { text-align: left; padding: 8px 12px; color: #6B7280; font-weight: 500; white-space: nowrap; }
    tbody tr { border-bottom: 0.5px solid #F3F4F6; transition: background 0.1s; }
    tbody tr:hover { background: #FAFBFF; }
    td { padding: 9px 12px; color: #374151; }
    @media (max-width: 768px) { aside { width: 180px; } main { padding: 1rem; } }
    @media (max-width: 480px) { aside { display: none; } main { max-width: 100%; } }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="react.production.min.js"></script>
  <script src="react-dom.production.min.js"></script>
  <script src="vendor/babel.min.js"></script>
  <!-- Optional cloud sync (Firebase Firestore) — see the CLOUD SYNC comment block at the top of
       app.js for setup steps. These two scripts load the Firebase SDK; the app only uses it once
       FIREBASE_CONFIG in app.js has been filled in with your project's keys. Safe to leave in
       even if you never set up Firebase — app.js falls back to local-only storage automatically. -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script type="text/babel" data-presets="react" src="app.js?v=2"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js")
        .catch(function(e) { console.warn("SW registration failed:", e); });
    }
  </script>
</body>
</html>
